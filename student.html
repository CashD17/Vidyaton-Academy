<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Dashboard — VIDYATON</title>
<link rel="stylesheet" href="dash.css">
<script src="auth.js"></script>
<script src="demo-data.js"></script>

<script src="assistant.js" defer></script>
</head>
<body class="dash" data-theme="violet">
<aside class="side" id="side">
  <a class="brand" href="index.html" title="VIDYATON home"><img src="logo.svg" alt="VIDYATON"><span>VIDYATON</span></a>
  <button class="nav-b on" data-view="overview"><i>🏠</i>Overview</button>

  <button class="nav-b" data-view="resources"><i>📚</i>Resources</button>

  <div class="top">
    <h1 id="title">Overview</h1>
    <div class="who"><button class="chip-btn" id="themeQuick">🎨 Theme</button><div class="avatar" id="av"></div></div>
